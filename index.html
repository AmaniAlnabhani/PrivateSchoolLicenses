<!DOCTYPE html>
<html dir="rtl" lang="ar">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">

</head>

<body>
    <nav class="navbar fixed-top navbar-dark bg-dark ">
        <div class="container d-flex justify-content-center">
            <a class="navbar-brand  " href="#">تراخيص المدارس الخاصة</a>

        </div>
    </nav>
    <section class="container">

        <div id="alertBox" class="alert"></div>
        <!-- me-5 margin end 5-->
        <div class="btns">
            <button onclick="showAll()" class="btn btn-primary ">عرض الكل</button>
            <button onclick="showExpiring()" class="btn btn-warning">التراخيص قريبة الإنتهاء</button>
            <button onclick="showExpiringAllready()" class="btn btn-danger">التراخيص المنتهية</button>
        </div>


        <table class="table table-bordered text-center  align-middle m-3">
            <thead>
                <tr>
                    <th>رمز المدرسة</th>
                    <th>اسم المدرسة</th>
                    <th>الولاية</th>
                    <th>النوع</th>
                    <th>تاريخ إنتهاء الترخيص</th>
                    <th>حالة الترخيص</th>
                </tr>
            </thead>
            <tbody id="tableData"></tbody>
        </table>
    </section>
    <script src="./node_modules/jquery/dist/jquery.min.js"></script>
    <script src="./js/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
